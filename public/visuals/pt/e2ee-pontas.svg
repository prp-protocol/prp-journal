<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">E2EE protege o caminho, mas a mensagem existe em claro nas pontas</title><desc id="d">O conteúdo é cifrado no dispositivo A, atravessa o servidor cifrado e é decifrado no dispositivo B. A inspeção pode ocorrer antes ou depois do transporte.</desc><rect width="1200" height="520" fill="#f8f5ee"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="600" y="60" font-size="28" font-weight="700" fill="#18211f">E2EE protege o caminho entre as pontas</text><rect x="70" y="170" width="270" height="150" rx="14" fill="#fffdf8" stroke="#c4492d" stroke-width="3"/><rect x="465" y="170" width="270" height="150" rx="14" fill="#0d6b62"/><rect x="860" y="170" width="270" height="150" rx="14" fill="#fffdf8" stroke="#c4492d" stroke-width="3"/><g font-size="22"><text x="205" y="215" fill="#18211f" font-weight="700">Dispositivo A</text><text x="205" y="257" fill="#c4492d">conteúdo em claro</text><text x="600" y="215" fill="white" font-weight="700">Servidor</text><text x="600" y="257" fill="white">conteúdo cifrado</text><text x="995" y="215" fill="#18211f" font-weight="700">Dispositivo B</text><text x="995" y="257" fill="#c4492d">conteúdo em claro</text></g><path d="M340 245H465M735 245H860" stroke="#18211f" stroke-width="5"/><text x="205" y="390" font-size="20" fill="#87301e">inspeção antes de cifrar</text><text x="995" y="390" font-size="20" fill="#87301e">inspeção após decifrar</text></g></svg>
