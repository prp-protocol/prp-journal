<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 790" role="img" aria-labelledby="t d">
  <title id="t">Agentes independentes interoperam sobre um protocolo comum</title>
  <desc id="d">Três agentes mantêm políticas locais diferentes, comunicam-se diretamente e implementam a mesma especificação pública, representada como base compartilhada e não como controlador.</desc>
  <rect width="1400" height="790" fill="#f8f5ee"/>
  <g font-family="system-ui,sans-serif" fill="#18211f">
    <text x="70" y="70" font-size="31" font-weight="700">Coordenação não exige soberania</text>
    <text x="70" y="108" font-size="20" fill="#5f6965">Cada agente decide localmente e permanece interoperável com os demais.</text>

    <g text-anchor="middle">
      <g transform="translate(115 205)">
        <rect width="370" height="270" rx="20" fill="#fffdf8" stroke="#c8c1b3" stroke-width="2"/>
        <circle cx="185" cy="53" r="25" fill="#f3d5cb"/><text x="185" y="61" font-size="23" font-weight="800" fill="#87301e">A</text>
        <text x="185" y="105" font-size="23" font-weight="700">Decisão local</text>
        <text x="185" y="137" font-size="17" fill="#5f6965">critérios desta relação</text>
        <rect x="48" y="175" width="274" height="58" rx="29" fill="#f3d5cb"/>
        <text x="185" y="212" font-size="18" fill="#87301e">política local A</text>
      </g>
      <g transform="translate(515 205)">
        <rect width="370" height="270" rx="20" fill="#fffdf8" stroke="#c8c1b3" stroke-width="2"/>
        <circle cx="185" cy="53" r="25" fill="#d8ebe6"/><text x="185" y="61" font-size="23" font-weight="800" fill="#0d6b62">B</text>
        <text x="185" y="105" font-size="23" font-weight="700">Decisão local</text>
        <text x="185" y="137" font-size="17" fill="#5f6965">critérios desta relação</text>
        <rect x="48" y="175" width="274" height="58" rx="29" fill="#d8ebe6"/>
        <text x="185" y="212" font-size="18" fill="#0d6b62">política local B</text>
      </g>
      <g transform="translate(915 205)">
        <rect width="370" height="270" rx="20" fill="#fffdf8" stroke="#c8c1b3" stroke-width="2"/>
        <circle cx="185" cy="53" r="25" fill="#eee7d8"/><text x="185" y="61" font-size="23" font-weight="800">C</text>
        <text x="185" y="105" font-size="23" font-weight="700">Decisão local</text>
        <text x="185" y="137" font-size="17" fill="#5f6965">critérios desta relação</text>
        <rect x="48" y="175" width="274" height="58" rx="29" fill="#eee7d8"/>
        <text x="185" y="212" font-size="18">política local C</text>
      </g>
    </g>

    <g stroke="#0d6b62" stroke-width="4" fill="none">
      <path d="M485 340h30"/><path d="M885 340h30"/>
    </g>
    <g fill="#0d6b62">
      <path d="M497 328l-18 12 18 12z"/><path d="M503 328l18 12-18 12z"/>
      <path d="M897 328l-18 12 18 12z"/><path d="M903 328l18 12-18 12z"/>
    </g>

    <g stroke="#63706b" stroke-width="3"><path d="M300 475v70"/><path d="M700 475v70"/><path d="M1100 475v70"/></g>
    <rect x="115" y="545" width="1170" height="105" rx="20" fill="#0d6b62"/>
    <text x="700" y="588" text-anchor="middle" font-size="24" font-weight="750" fill="white">PROTOCOLO COMUM</text>
    <text x="700" y="622" text-anchor="middle" font-size="18" fill="white">especificação pública · implementação independente · provas verificáveis</text>

    <text x="70" y="735" font-size="24" font-weight="700" fill="#0d6b62">O padrão coordena. Cada relação decide.</text>
  </g>
</svg>
