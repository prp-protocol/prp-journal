<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 790" role="img" aria-labelledby="t d"><title id="t">Vários domínios compartilham o mesmo endereço IP</title><desc id="d">Quatro domínios convergem em uma CDN com um IP. Uma ordem contra um domínio é executada pelo bloqueio do IP e interrompe todos.</desc><rect width="1400" height="790" fill="#f8f5ee"/><g font-family="system-ui,sans-serif" fill="#18211f"><text x="70" y="70" font-size="31" font-weight="700">O alvo jurídico e o alvo da rede não são a mesma coisa</text><text x="70" y="108" font-size="20" fill="#5f6965">Domínios diferentes podem compartilhar exatamente o mesmo endereço.</text><text x="205" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#5f6965">NOMES E SERVIÇOS</text><g text-anchor="middle" font-size="19"><rect x="65" y="205" width="280" height="72" rx="10" fill="#f3d5cb" stroke="#c4492d" stroke-width="2"/><text x="205" y="249" font-weight="700">alvo.example</text><rect x="65" y="315" width="280" height="72" rx="10" fill="#fffdf8" stroke="#c8c1b3"/><text x="205" y="359">jornal.example</text><rect x="65" y="425" width="280" height="72" rx="10" fill="#fffdf8" stroke="#c8c1b3"/><text x="205" y="469">api.example</text><rect x="65" y="535" width="280" height="72" rx="10" fill="#fffdf8" stroke="#c8c1b3"/><text x="205" y="579">comunidade.example</text></g><text x="630" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#5f6965">INFRAESTRUTURA COMPARTILHADA</text><rect x="500" y="310" width="260" height="190" rx="18" fill="#0d6b62"/><text x="630" y="368" text-anchor="middle" font-size="26" font-weight="700" fill="white">Nuvem / CDN</text><text x="630" y="408" text-anchor="middle" font-size="19" fill="white">um nó, vários clientes</text><rect x="535" y="438" width="190" height="38" rx="19" fill="#084c46"/><text x="630" y="464" text-anchor="middle" font-family="monospace" font-size="18" fill="white">203.0.113.42</text><g fill="none" stroke="#63706b" stroke-width="3"><path d="M345 241C425 241 425 350 500 350"/><path d="M345 351C425 351 425 390 500 390"/><path d="M345 461C425 461 425 430 500 430"/><path d="M345 571C425 571 425 470 500 470"/></g><text x="420" y="640" text-anchor="middle" font-size="17" fill="#5f6965">DNS: todos apontam para o mesmo IP</text><path d="M760 405H1220" stroke="#18211f" stroke-width="7"/><rect x="895" y="245" width="62" height="320" rx="8" fill="#c4492d"/><path d="M905 270l42 270M947 270l-42 270" stroke="#f8f5ee" stroke-width="9"/><text x="926" y="598" text-anchor="middle" font-size="18" font-weight="700" fill="#87301e">BLOQUEIO DO IP</text><g transform="translate(1160 330)" text-anchor="middle"><circle r="35" fill="#18211f"/><path d="M-58 135c8-61 34-92 58-92s50 31 58 92" fill="#18211f"/><text y="190" font-size="21" font-weight="700">Usuários</text><text y="220" font-size="18" fill="#c4492d">todos sem acesso</text></g><rect x="825" y="135" width="390" height="75" rx="10" fill="#fff4e6" stroke="#c4492d"/><text x="1020" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#87301e">A ordem aponta um domínio.</text><text x="1020" y="194" text-anchor="middle" font-size="18" fill="#87301e">A rede bloqueia o IP compartilhado.</text><path d="M205 205V172H825" fill="none" stroke="#c4492d" stroke-width="3" stroke-dasharray="8 7"/><text x="70" y="735" font-size="24" font-weight="700" fill="#0d6b62">A decisão conhece o conteúdo. O roteador conhece o destino.</text></g></svg>
