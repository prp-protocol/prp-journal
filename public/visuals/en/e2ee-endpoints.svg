<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">E2EE protects the path, but plaintext exists at the endpoints</title><desc id="d">Content is encrypted on device A, crosses the server encrypted, and is decrypted on device B. Inspection can happen before or after transport.</desc><rect width="1200" height="520" fill="#f8f5ee"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="600" y="60" font-size="28" font-weight="700" fill="#18211f">E2EE protects the path between endpoints</text><rect x="70" y="170" width="270" height="150" rx="14" fill="#fffdf8" stroke="#c4492d" stroke-width="3"/><rect x="465" y="170" width="270" height="150" rx="14" fill="#0d6b62"/><rect x="860" y="170" width="270" height="150" rx="14" fill="#fffdf8" stroke="#c4492d" stroke-width="3"/><g font-size="22"><text x="205" y="215" fill="#18211f" font-weight="700">Device A</text><text x="205" y="257" fill="#c4492d">plaintext</text><text x="600" y="215" fill="white" font-weight="700">Server</text><text x="600" y="257" fill="white">ciphertext</text><text x="995" y="215" fill="#18211f" font-weight="700">Device B</text><text x="995" y="257" fill="#c4492d">plaintext</text></g><path d="M340 245H465M735 245H860" stroke="#18211f" stroke-width="5"/><text x="205" y="390" font-size="20" fill="#87301e">inspection before encryption</text><text x="995" y="390" font-size="20" fill="#87301e">inspection after decryption</text></g></svg>
